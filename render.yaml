databases:
  - name: galaxyfood-db
    databaseName: galaxyfood
    user: galaxyfood
    plan: free

services:
  - type: web
    name: galaxyfood-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: galaxyfood-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRES_IN
        value: 8h
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: "30"
      # Free-tier services get a predictable https://<name>.onrender.com URL
      # as long as the name below isn't already taken by someone else on
      # Render. If Render had to rename galaxyfood-admin/galaxyfood-tv at
      # signup, update this (and the two VITE_API_URL values below) to match.
      - key: CORS_ORIGINS
        value: https://galaxyfood-admin.onrender.com,https://galaxyfood-tv.onrender.com
      - key: SEED_ADMIN_EMAIL
        value: ahmed@galaxy.com
      # Filled in the Render dashboard after the first deploy, not here —
      # this file is committed to the repo.
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    name: galaxyfood-admin
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://galaxyfood-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: galaxyfood-tv
    runtime: static
    rootDir: frontend-tv
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://galaxyfood-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
